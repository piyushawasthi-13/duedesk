<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<meta name="description" content="DueDesk — rent and fee dashboard for PGs, libraries, gyms and tuition.">
<title>DueDesk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hind:wght@400;500;600&display=swap">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f1f4f1; --surface:#ffffff; --ink:#14201b; --muted:#5d6b64; --line:#dbe3dd; --grid:#e8eee9;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dff0eb; --side:#0d2a23; --side-ink:#d5e6df; --side-muted:#8fb0a4; --side-active:#174a3e;
  --good:#2f7d4f; --good-soft:#e1f1e7; --warn:#a96a10; --warn-soft:#f8ecd6; --bad:#b3382c; --bad-soft:#f7e0dd; --info:#2c5f9e; --info-soft:#e2ecf8;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 8px 24px rgba(20,32,27,.06);
  --display:'Bricolage Grotesque','Hind',system-ui,sans-serif;
  --body:'Hind','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1512; --surface:#16201b; --ink:#e6eee9; --muted:#97a69d; --line:#25332c; --grid:#1f2a24;
  --accent:#4cc3a8; --accent-ink:#06231c; --accent-soft:#17342d; --side:#0a120f; --side-ink:#d5e6df; --side-muted:#7f978d; --side-active:#16302a;
  --good:#6fcf97; --good-soft:#173324; --warn:#e3b05a; --warn-soft:#38290f; --bad:#f08a7e; --bad-soft:#3b1d19; --info:#8fb8ef; --info-soft:#1a2a40;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#16201b; --ink:#e6eee9; --muted:#97a69d; --line:#25332c; --grid:#1f2a24;
  --accent:#4cc3a8; --accent-ink:#06231c; --accent-soft:#17342d; --side:#0a120f; --side-ink:#d5e6df; --side-muted:#7f978d; --side-active:#16302a;
  --good:#6fcf97; --good-soft:#173324; --warn:#e3b05a; --warn-soft:#38290f; --bad:#f08a7e; --bad-soft:#3b1d19; --info:#8fb8ef; --info-soft:#1a2a40;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px} h3{font-size:17px}
.sub{color:var(--muted);font-size:14px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;align-items:center;gap:12px}
.row.sb{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- layout: sidebar on desktop, bottom tabs on phone ---------- */
.shell{min-height:100vh}
.side{display:none}
.main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));max-width:1180px;margin:0 auto}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font:700 22px var(--display);display:flex;align-items:center;gap:8px}
.brand img{width:28px;height:28px;border-radius:8px}
.mtop select{width:auto;max-width:55%;min-height:38px;padding:6px 10px;font-size:14px;font-weight:600}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px}
.phead .sub{margin-top:2px}
.phead .btn.desk{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{display:flex;width:100%;max-width:560px}
.tab{flex:1;border:0;background:none;padding:9px 4px;color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;box-shadow:var(--shadow);border-radius:99px;padding:12px 18px}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:236px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);padding:22px 14px}
  .side .brand{color:#fff;padding:0 8px 14px}
  .side select{background:var(--side-active);border-color:transparent;color:var(--side-ink);margin:0 0 12px;min-height:40px;font-weight:600}
  .side .nav{border:0;background:none;color:var(--side-ink);text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;position:relative;font-size:15px}
  .side .nav svg{width:20px;height:20px;opacity:.85}
  .side .nav:hover{background:var(--side-active)}
  .side .nav[aria-current="page"]{background:var(--side-active);color:#fff}
  .side .nav .dot{position:static;margin-left:auto}
  .side .foot{margin-top:auto;font-size:13px;color:var(--side-muted);padding:0 8px;word-break:break-all}
  .main{padding:28px 32px 48px;width:100%}
  .mtop,.tabs,.btn.fab{display:none}
  .phead .btn.desk{display:inline-flex}
}

/* ---------- pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.flush{padding:6px 16px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font:700 26px/1.15 var(--display);margin-top:4px}
.kpi .sm{font-size:13px;color:var(--muted);margin-top:2px}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero .lbl,.kpi.hero .sm{color:var(--accent-ink);opacity:.85}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)} .kpi .val{font-size:30px}}
.dgrid{display:grid;gap:16px;margin-top:16px}
@media (min-width:1100px){.dgrid{grid-template-columns:1.25fr 1fr;align-items:start}}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 15px var(--display);flex:none}
.avatar.off{background:var(--line);color:var(--muted)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;vertical-align:middle}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.mute{background:var(--accent-soft);color:var(--accent)}
.chip.off{background:var(--line);color:var(--muted)} .chip.info{background:var(--info-soft);color:var(--info)}
.amt{font:700 16px var(--display);text-align:right;white-space:nowrap}
.banner{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-weight:500;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner button{white-space:nowrap}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn.xs{padding:2px 9px;min-height:30px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.phead .btn{white-space:nowrap}
.btn:disabled{opacity:.55}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible,.item:focus-visible,.nav:focus-visible,.col:focus-visible,tr:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;color:var(--accent);flex:none}
.iconbtn svg{width:18px;height:18px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;width:max-content;max-width:min(90vw,480px);text-align:center;font-weight:500;box-shadow:var(--shadow)}
@media (min-width:960px){#toasts{bottom:28px}}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);margin:0;font-size:16px;font-weight:500;color:var(--ink)}
.switch:last-child{border-bottom:0}
.switch input{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:600;color:var(--muted);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-height:36px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{max-width:360px}
.ledger .line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.ledger .line:last-child{border:0}
.plan{border:1.5px solid var(--line);border-radius:14px;padding:14px}
.plan.cur{border-color:var(--accent);background:var(--accent-soft)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
.kv span:first-child{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all}
ol.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14px}
ol.steps li{margin:2px 0}
.setgrid{display:grid;gap:16px}
@media (min-width:1100px){.setgrid{grid-template-columns:1fr 1fr;align-items:start}}

/* live payment feed */
.feed .item{cursor:default}
.feed .item.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%{background:var(--good-soft)}100%{background:transparent}}
.livedot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--good)}
.livedot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.livedot.off{color:var(--muted)} .livedot.off::before{background:var(--muted)}

/* claims */
.mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;gap:2px}
.meter i{display:block;height:100%;background:var(--good)}
.meter i.p{background:var(--warn)}
.claim{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.claim:last-child{border:0}
.claim .acts{display:flex;gap:8px;margin-left:auto}

/* chart (single series → no legend; title names it) */
.chart{position:relative;padding:8px 0 0 44px;height:220px}
.chart .yl{position:absolute;left:0;right:0;border-top:1px solid var(--grid);font-size:12px;color:var(--muted)}
.chart .yl span{position:absolute;left:0;top:-9px;width:40px;text-align:right;padding-right:6px;background:var(--surface)}
.chart .yl.zero{border-top-color:var(--line)}
.chart .cols{position:absolute;left:44px;right:0;top:8px;bottom:26px;display:flex;align-items:flex-end;gap:2px}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:default;position:relative;outline:none;border-radius:6px}
.chart .col:hover,.chart .col:focus-visible{background:var(--accent-soft)}
.chart .b{width:min(42px,60%);background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.chart .col.past .b{opacity:.55}
.chart .col .v{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:3px;white-space:nowrap}
.chart .xl{position:absolute;left:44px;right:0;bottom:0;display:flex;gap:2px}
.chart .xl span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.tip{position:absolute;z-index:3;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px}
.tip b{font-weight:700}

/* members table (desktop) */
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--bg)}
.tbl .r{text-align:right}
.only-desk{display:none} .only-phone{display:block}
@media (min-width:760px){.only-desk{display:block} .only-phone{display:none}}

/* sheet / dialog */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88vh;padding:22px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.auth{max-width:420px;margin:8vh auto 0;padding:0 16px}
.auth h1{font-size:34px;margin-bottom:6px}
.err{color:var(--bad);font-weight:500;min-height:1.4em}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;cursor:pointer;text-decoration:underline}
</style>
</head>

const today = () => iso(new Date());

function t(k, v={}){ if(v.n===1 && (I18N[lang()][k+'1'] ?? I18N.en[k+'1'])) k=k+'1'; let s = (I18N[lang()][k] ?? I18N.en[k] ?? k); for(const x in v) s = s.replaceAll('{'+x+'}', v[x]); return s; }
const loc = () => lang()==='hi'?'hi-IN':'en-IN';
function fdate(s, yr){ return P(s).toLocaleDateString(loc(), yr?{day:'numeric',month:'short',year:'numeric'}:{day:'numeric',month:'short'}); }
const mName = (ym, long) => P(ym+'-01').toLocaleDateString(loc(), long?{month:'long',year:'numeric'}:{month:'short'});
function ago(ts){ const s=(Date.now()-new Date(ts).getTime())/1000; if(s<60) return t('justNow');
  const rtf=new Intl.RelativeTimeFormat(loc(),{numeric:'auto'}); if(s<3600) return rtf.format(-Math.round(s/60),'minute'); if(s<86400) return rtf.format(-Math.round(s/3600),'hour'); return fdate(new Date(ts).toISOString()); }
function toast(msg){ let box=$('#toasts'); if(!box){ box=document.createElement('div'); box.id='toasts'; box.setAttribute('aria-live','polite'); document.body.appendChild(box); }
  const e=document.createElement('div'); e.className='toast'; e.setAttribute('role','status'); e.textContent=msg; box.appendChild(e); while(box.children.length>3) box.firstChild.remove(); setTimeout(()=>e.remove(),4000); }

function anchor(y,m,dd){ const last=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(dd,last)); }
function cycleStart(s,dd){ const d=P(s); let a=anchor(d.getFullYear(),d.getMonth(),dd); if(a>d) a=anchor(d.getFullYear(),d.getMonth()-1,dd); return iso(a); }
function nextAnchor(s,dd){ const d=P(s); return iso(anchor(d.getFullYear(),d.getMonth()+1,dd)); }

async function fetchAll(make){
  let out=[], from=0;
  for(;;){ const r=await make().range(from, from+999); if(r.error) throw r.error; out=out.concat(r.data||[]); if(!r.data||r.data.length<1000) break; from+=1000; }
  return out;
}
async function loadAll(){
  const uid=S.session.user.id;
  const [o,p,pl,gw]=await Promise.all([
    sb.from('owners').select('*').eq('id',uid).maybeSingle(),
    sb.from('properties').select('*').order('created_at'),
    sb.from('plans').select('*').order('price_monthly'),
    sb.rpc('my_gateway')]);
  for(const r of [o,p,pl]) if(r.error) throw r.error;
  const [tb,tk,ch,pay,cl,lg,dp,pr]=await Promise.all([
    fetchAll(()=>sb.from('tenant_balances').select('*').order('name')),
    fetchAll(()=>sb.from('tenants').select('id,pay_token')),
    fetchAll(()=>sb.from('charges').select('id,tenant_id,kind,period_start,period_end,due_date,days_charged,amount,label').order('due_date')),
    fetchAll(()=>sb.from('payments').select('id,tenant_id,amount,paid_on,mode,source,ref,note,created_at').order('paid_on',{ascending:false}).order('created_at',{ascending:false})),
    sb.from('payment_claims').select('*').eq('status','pending').order('created_at',{ascending:false}).then(r=>r.data||[]),
    sb.from('tenant_logins').select('tenant_id,phone').then(r=>r.data||[]),
    fetchAll(()=>sb.from('deposit_payments').select('id,tenant_id,amount,mode,paid_on,note').order('paid_on')).catch(()=>[]),
    sb.from('tenant_promises').select('*').then(r=>r.data||[])]);
  const tok=Object.fromEntries(tk.map(x=>[x.id,x.pay_token]));
  tb.forEach(x=>x.pay_token=tok[x.tenant_id]);
  S.owner=o.data; S.props=p.data||[]; S.plans=pl.data||[]; S.gw=(gw&&gw.data)||{connected:false};
  S.charges=ch; S.payments=pay; S.tenants=tb; S.claims=cl; S.logins=Object.fromEntries(lg.map(x=>[x.tenant_id,x.phone])); S.deposits=dp; S.promises=Object.fromEntries(pr.map(x=>[x.tenant_id,x]));
  if(S.pid!=='all' && !S.props.some(x=>x.id===S.pid)) S.pid='all';
  enrich(); S.loaded=true;
  store.set('dd_cache_'+uid, JSON.stringify({o:S.owner,p:S.props,pl:S.plans,tb,ch,pay,cl,gw:S.gw}));
}
function loadCache(){
  try{ const c=JSON.parse(store.get('dd_cache_'+S.session.user.id)||'null'); if(!c) return false;
    S.owner=c.o; S.props=c.p; S.plans=c.pl; S.tenants=c.tb; S.charges=c.ch; S.payments=c.pay; S.claims=c.cl||[]; S.gw=c.gw||{connected:false}; enrich(); S.loaded=true; return true; }catch(e){ return false; }
}
function enrich(){
  const td=today(), by={};
  S.charges.forEach(c=>(by[c.tenant_id]??={ch:[],pay:[]}).ch.push(c));
  S.payments.forEach(p=>(by[p.tenant_id]??={ch:[],pay:[]}).pay.push(p));
  S.tenants.forEach(x=>{
    const g=by[x.tenant_id]||{ch:[],pay:[]}; x.ledger=g;
    x.bal=Number(x.balance); x.dueNow=Number(x.due_now);
    x.depReceived=Number(x.deposit_received||0); x.depLeft=x.depReceived-Number(x.deposit_used);
    x.depPending=Math.max(0,Number(x.security_deposit)-x.depReceived);
    x.depList=(S.deposits||[]).filter(d=>d.tenant_id===x.tenant_id);
    x.paidBy={}; g.pay.forEach(p=>{ if(p.mode==='deposit') return; const k=p.mode; x.paidBy[k]=(x.paidBy[k]||0)+Number(p.amount); });
    let credit=g.pay.reduce((s,p)=>s+Number(p.amount),0) - g.ch.filter(c=>Number(c.amount)<0).reduce((s,c)=>s+Number(c.amount),0);
    let oldest=null;
    for(const c of g.ch){ const a=Number(c.amount); if(a<0) continue; if(credit>=a) credit-=a; else { oldest=c.due_date; break; } }
    x.oldest=oldest; x.late=oldest?dayDiff(oldest,td):null;
    x.months=monthWise(g.ch,g.pay,td);
    x.promise=(S.promises||{})[x.tenant_id]||null;
    if(x.promise){ const pd=x.promise.promise_date; x.pstate = x.promise.kept ? 'kept' : pd>td ? 'upcoming' : pd===td ? 'today' : 'missed'; }
    else x.pstate=null;
    x.cur=x.months.find(m=>m.c.period_start<=td && td<=m.c.period_end) || null;
    if(x.dueNow>0) x.status = x.late>0 ? 'late' : 'today';
    else if(x.bal>0) x.status='soon';
    else if(x.bal<0) x.status='advance';
    else x.status='paid';
    x.next = x.is_active ? (cycleStart(td,x.due_day)===td ? td : nextAnchor(cycleStart(td,x.due_day),x.due_day)) : null;
    if(x.is_active && x.join_date>td) x.next=x.join_date;
    if(x.next && x.left_date && x.next>x.left_date) x.next=null;
    x.prop=S.props.find(p=>p.id===x.property_id);
    x.lastPay=g.pay[0]||null;
  });
  const rank={late:0,today:1,soon:2,advance:3,paid:4};
  S.tenants.sort((a,b)=>(b.is_active-a.is_active) || rank[a.status]-rank[b.status] || (b.late||0)-(a.late||0) || a.name.localeCompare(b.name));
}
// Month-wise rent: payments (and discounts) settle the oldest dues first; each rent month gets Paid / Partly paid / Pending.
function monthWise(charges, pays, td){
  const ch=charges.filter(c=>Number(c.amount)>0).slice().sort((a,b)=>a.due_date<b.due_date?-1:a.due_date>b.due_date?1:0);
  let credit=pays.reduce((s,p)=>s+Number(p.amount),0)-charges.filter(c=>Number(c.amount)<0).reduce((s,c)=>s+Number(c.amount),0);
  const out=[];
  for(const c of ch){ const a=Number(c.amount), cov=Math.max(0,Math.min(a,credit)); credit-=cov;
    if(c.kind!=='rent') continue;
    out.push({c, amount:a, paid:cov, left:a-cov, status: cov>=a?'paid':cov>0?'part':(c.due_date>td?'upcoming':'due')}); }
  return out.reverse();
}
const mLabel = c => P(c.period_start).toLocaleDateString(loc(),{month:'long',year:'numeric'});
const mRange = c => fdate(c.period_start)+' – '+fdate(c.period_end);
function mChip(m){
  if(m.status==='paid') return `<span class="chip good">✓ ${esc(t('mPaid'))}</span>`;
  if(m.status==='part') return `<span class="chip warn">${esc(t('mPart',{a:money(m.left)}))}</span>`;
  if(m.status==='upcoming') return `<span class="chip mute">${esc(t('mUpcoming'))}</span>`;
  return `<span class="chip bad">${esc(t('mDue'))}</span>`;
}
function monthList(x, limit){
  const ms=x.months.slice(0,limit||24);
  if(!ms.length) return `<div class="empty">${esc(t('noHistory'))}</div>`;
  return ms.map(m=>`<div class="mrow"><div class="grow"><div style="font-weight:600">${esc(mLabel(m.c))}</div><div class="sub">${esc(mRange(m.c))}${m.c.days_charged&&m.c.label&&m.c.label.startsWith('Rent ·')?' · '+esc(t('daysN',{n:m.c.days_charged})):''}</div></div>
    <div style="text-align:right"><div class="num" style="font-weight:700">${money(m.amount)}</div>${mChip(m)}</div></div>`).join('');
}
const visible = () => S.tenants.filter(x=>S.pid==='all'||x.property_id===S.pid);
const byTenant = () => Object.fromEntries(S.tenants.map(x=>[x.tenant_id,x]));
function visiblePayments(){ const ids=new Set(visible().map(x=>x.tenant_id)); return S.payments.filter(p=>ids.has(p.tenant_id)); }
function access(){
  const o=S.owner; if(!o) return {ok:false,days:0};
  const now=Date.now(), grace=3*864e5, ends=o.plan_ends_at?new Date(o.plan_ends_at).getTime():null;
  if(o.plan_status==='trialing'){ const d=Math.ceil((new Date(o.trial_ends_at)-now)/864e5); return {ok:d>0,days:Math.max(d,0),trial:true}; }
  if(o.plan_status==='active') return {ok:!ends||ends>now-grace,ends};
  if(o.plan_status==='past_due'||o.plan_status==='cancelled') return {ok:!!ends&&ends>now-grace,ends,warn:o.plan_status==='past_due'};
  return {ok:false};
}

function propName(x){ return (x&&x.prop&&x.prop.name) || (S.props[0]&&S.props[0].name) || 'DueDesk'; }

// ---------- auth ----------
const phoneDigits = p => { let d=String(p||'').replace(/\D/g,''); if(d.length>10) d=d.slice(-10); return d; };
const phoneEmail = d => d+'@tenant.duedesk.app';
const pinPassword = pin => 'DD-pin-'+pin+'-tenant';
const isTenantUser = u => !!(u && u.user_metadata && u.user_metadata.role==='tenant');
function renderAuth(){
  const tenant=S.authRole==='tenant', signup=!tenant && S.authMode==='signup';
  $('#layer').innerHTML='';
  $('#app').innerHTML=`<div class="auth stack">
    <div class="brand"><img src="icon.svg" alt="">DueDesk</div>
    <div><h1>${esc(tenant?t('tenantLogin'):signup?t('signup'):t('login'))}</h1><p class="sub" style="margin:0">${esc(tenant?t('tenantTag'):t('tagline'))}</p></div>
    <div class="seg" role="group" aria-label="${esc(t('iAm'))}"><button type="button" data-role="owner" aria-pressed="${!tenant}">${esc(t('roleOwner'))}</button><button type="button" data-role="tenant" aria-pressed="${tenant}">${esc(t('roleTenant'))}</button></div>
    ${tenant?`<form id="tlForm" class="stack card">
      <div><label for="tph">${esc(t('phone'))}</label><input id="tph" type="tel" inputmode="tel" autocomplete="tel" required placeholder="98765 43210" value="${esc(S.authPhone||'')}"></div>
      <div><label for="tpin">${esc(t('pin'))}</label><input id="tpin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="current-password" required></div>
      <div class="err" id="authErr" role="alert">${esc(S.authMsg)}</div>
      <button class="btn block" id="authGo">${esc(t('login'))}</button>
      <p class="sub" style="margin:0">${esc(t('pinHelp'))}</p></form>`
    :`<form id="authForm" class="stack card">
      <div><label for="em">${esc(t('email'))}</label><input id="em" type="email" autocomplete="email" required value="${esc(S.authEmail||'')}"></div>
      <div><label for="pw">${esc(t('password'))}</label><input id="pw" type="password" minlength="6" autocomplete="${signup?'new-password':'current-password'}" required></div>
      <div class="err" id="authErr" role="alert">${esc(S.authMsg)}</div>
      <button class="btn block" id="authGo">${esc(signup?t('signup'):t('login'))}</button>
      <button class="btn ghost block" type="button" id="authSwap">${esc(signup?t('haveAcc'):t('noAcc'))}</button>
      ${signup?'':`<button class="linkbtn" type="button" id="forgot">${esc(t('forgot'))}</button>`}
    </form>`}
    <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="${lang()==='en'}">English</button><button type="button" data-lang="hi" aria-pressed="${lang()==='hi'}">हिंदी</button></div>
    </div>`;
  $$('[data-role]').forEach(b=>b.onclick=()=>{ S.authRole=b.dataset.role; store.set('dd_role',S.authRole); S.authMsg=''; renderAuth(); });
  $$('[data-lang]').forEach(b=>b.onclick=()=>{store.set('dd_lang',b.dataset.lang); const em=$('#em'); if(em) S.authEmail=em.value; renderAuth();});
  const fail = m => { if($('#authGo')) $('#authGo').disabled=false; S.authMsg=m; if($('#authErr')) $('#authErr').textContent=m; };
  if(tenant){
    $('#tlForm').onsubmit=async e=>{ e.preventDefault(); const d=phoneDigits($('#tph').value), pin=$('#tpin').value.trim(); S.authPhone=$('#tph').value;
      if(!/^[6-9]\d{9}$/.test(d)) return fail(t('badPhone'));
      if(!/^\d{4,6}$/.test(pin)) return fail(t('badPin'));
      $('#authGo').disabled=true;
      const r=await sb.auth.signInWithPassword({email:phoneEmail(d),password:pinPassword(pin)});
      if(r.error) return fail(/invalid/i.test(r.error.message)?t('badTenantLogin'):r.error.message); };
    return;
  }
  $('#authSwap').onclick=()=>{S.authMode=signup?'login':'signup';S.authMsg='';renderAuth();};
  const fg=$('#forgot'); if(fg) fg.onclick=async()=>{ const em=$('#em').value.trim(); if(!em){ $('#authErr').textContent=t('enterEmail'); return; }
    const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
    $('#authErr').textContent = r.error ? r.error.message : t('resetSent'); };
  $('#authForm').onsubmit=async e=>{
    e.preventDefault(); const em=$('#em').value.trim(), pw=$('#pw').value; $('#authGo').disabled=true; S.authEmail=em;
    if(signup){ // account is created already confirmed (no confirmation email), then we log in
      let res; try{ res=await fetch(SUPABASE_URL+'/functions/v1/signup',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify({email:em,password:pw})}); }catch(e){ return fail(t('netErr')); }
      const j=await res.json().catch(()=>({}));
      if(!res.ok){ if(j.error==='EXISTS'){ S.authMode='login'; S.authMsg=t('exists'); return renderAuth(); }
        return fail(j.error==='BAD_EMAIL'?t('badEmail'):j.error==='WEAK_PASSWORD'?t('password'):(j.detail||t('netErr'))); }
    }
    const r = await sb.auth.signInWithPassword({email:em,password:pw});
    if($('#authGo')) $('#authGo').disabled=false;
    if(r.error) return fail(/invalid/i.test(r.error.message)?t('badLogin'):r.error.message);
  };
}
async function goTenant(){
  $('#layer').innerHTML='';
  $('#app').innerHTML=`<p class="empty">${esc(t('loading'))}</p>`;
  const r=await sb.rpc('my_tenancies');
  const rows=(r.data||[]);
  if(rows.length===1 || (rows.length && rows[0].active && !rows.slice(1).some(x=>x.active))){ location.replace('pay.html?t='+encodeURIComponent(rows[0].pay_token)+'&me=1'); return; }
  $('#app').innerHTML=`<div class="auth stack"><div class="brand"><img src="icon.svg" alt="">DueDesk</div>
    <div class="card stack">${rows.length?`<h2>${esc(t('pickRoom'))}</h2>${rows.map(x=>`<a class="item" style="text-decoration:none;color:inherit" href="pay.html?t=${encodeURIComponent(x.pay_token)}&me=1"><div class="grow"><b>${esc(x.place)}</b><div class="sub">${esc([x.name,x.room].filter(Boolean).join(' · '))}</div></div><span class="sub">›</span></a>`).join('')}`
      :`<h2>${esc(t('noRoom'))}</h2><p class="sub" style="margin:0">${esc(t('noRoomHelp'))}</p>`}
    <button class="btn ghost" id="tlo">${esc(t('logout'))}</button></div></div>`;
  $('#tlo').onclick=()=>sb.auth.signOut();
}
function openRecovery(){
  sheet(`<form id="rcForm" class="stack"><h2>${esc(t('setPassword'))}</h2>
    <div><label for="np">${esc(t('newPassword'))}</label><input id="np" type="password" minlength="6" autocomplete="new-password" required></div>
    <button class="btn block">${esc(t('save'))}</button></form>`);
  $('#rcForm').onsubmit=async e=>{ e.preventDefault(); const r=await sb.auth.updateUser({password:$('#np').value});
    if(r.error) return toast(r.error.message); S.recovery=false; closeSheet(); toast(t('saved')); };
}

const TABS=[['home','dashboard'],['list','tenants'],['pay','payments'],['settings','settings']];
function render(){
  document.documentElement.lang = lang()==='hi'?'hi':'en';
  if(!S.session) return renderAuth();
  if(S.tenantMode) return;
  if(!S.loaded){ $('#app').innerHTML=`<p class="empty">${esc(t('loading'))}</p>`; return; }
  if(S.dbOld){ $('#layer').innerHTML=''; $('#app').innerHTML=`<div class="auth stack" style="max-width:640px">
    <div class="brand"><img src="icon.svg" alt="">DueDesk</div>
    <div class="card stack"><h2>Database update needed</h2>
    <p style="margin:0">This version of DueDesk needs the new database tables. It's a one-time step for whoever manages the Supabase project:</p>
    <ol class="steps" style="color:var(--ink);font-size:15px"><li>Supabase → <b>Database → Extensions</b>: enable <b>pg_cron</b> and <b>pg_net</b>.</li>
    <li>Supabase → <b>SQL Editor</b> → New query → paste all of <b>supabase/schema.sql</b> → <b>Run</b>.</li>
    <li>The last row should say <b>v3 ready</b>. Then reload this page.</li></ol>
    <div class="sub">Details: <span class="code" style="display:inline-block">${esc(S.dbOld)}</span></div>
    <div class="row"><button class="btn" onclick="location.reload()">Reload</button><button class="btn ghost" id="lo2">Log out</button></div></div></div>`;
    $('#lo2').onclick=()=>sb.auth.signOut(); return; }
  if(!S.props.length) return renderSetup();
  const views={home:viewHome,list:viewList,pay:viewPayments,settings:viewSettings};
  const placeSel = S.props.length>1 ? `<select id="pid" aria-label="${esc(t('pickPlace'))}"><option value="all">${esc(t('allPlaces'))}</option>${S.props.map(p=>`<option value="${p.id}" ${S.pid===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>` : '';
  const badge = k => k==='home' && S.claims.length ? `<span class="dot">${S.claims.length}</span>` : '';
  $('#app').innerHTML = `<div class="shell">
    <aside class="side" aria-label="Main">
      <div class="brand"><img src="icon.svg" alt="">DueDesk</div>${placeSel.replace('id="pid"','id="pidSide"')}
      ${TABS.map(([k,l])=>`<button class="nav" data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${ICON[k]}<span>${esc(t(l))}</span>${badge(k)}</button>`).join('')}
      <div class="foot">${esc(S.session.user.email||'')}</div>
    </aside>
    <main class="main">
      <div class="mtop"><div class="brand"><img src="icon.svg" alt="">DueDesk</div>${placeSel}</div>
      ${navigator.onLine===false?`<div class="banner">${esc(t('offline'))}</div>`:''}
      ${views[S.tab]()}
    </main></div>
    <nav class="tabs" aria-label="Main"><div class="in">${TABS.map(([k,l])=>`<button class="tab" data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${ICON[k]}<span>${esc(t(l))}</span>${badge(k)}</button>`).join('')}</div></nav>`;
  bindMain();
}
function phead(title, sub, action){
  return `<div class="phead"><div><h1>${esc(title)}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>${action||''}</div>`;
}
const addBtn = () => `<button class="btn desk" data-act="addT">${ICON.plus} ${esc(t('addTenant'))}</button>`;
const fab = () => `<button class="btn fab" data-act="addT">+ ${esc(t('addTenant'))}</button>`;
function planBanner(){
  const ac=access();
  if(!ac.ok) return `<div class="banner bad"><span>${esc(S.owner.plan_status==='trialing'?t('trialEnded'):t('expiredMsg'))}</span><button class="btn sm" data-act="plans">${esc(t('upgrade'))}</button></div>`;
  if(ac.warn) return `<div class="banner bad"><span>${esc(t('pastDue'))}</span><button class="btn sm" data-act="plans">${esc(t('plan'))}</button></div>`;
  if(ac.trial && ac.days<=10) return `<div class="banner info"><span>${esc(t('trialLeft',{n:ac.days}))}</span><button class="btn sm soft" data-act="plans">${esc(t('plan'))}</button></div>`;
  return '';
}
function alertNudge(){
  if(!S.owner.notify_push || store.get('dd_push_on')==='1' || store.get('dd_nudge_off')==='1') return '';
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return '';
  if(('Notification' in window) && Notification.permission==='denied') return '';
  return `<div class="banner info"><span>${esc(t('alertsHelp'))}</span><button class="btn sm" data-act="push">${esc(t('enableAlerts'))}</button></div>`;
}
function onlineNudge(){
  if(S.gw.connected || S.owner.upi_id || store.get('dd_online_nudge_off')==='1') return '';
  return `<div class="banner info"><span>${esc(t('nudgeOnline'))}</span><button class="btn sm" data-tab="settings">${esc(t('setUp'))}</button></div>`;
}

// ---------- dashboard ----------
function viewHome(){
  const V=visible(), td=today(), ym=td.slice(0,7), pays=visiblePayments();
  const hot=V.filter(x=>x.dueNow>0);
  const toCollect=hot.reduce((s,x)=>s+x.dueNow,0);
  const monthPays=pays.filter(p=>p.paid_on.slice(0,7)===ym && p.mode!=='deposit');
  const got=monthPays.reduce((s,p)=>s+Number(p.amount),0);
  const onl=monthPays.filter(p=>p.source!=='owner');
  const onlSum=onl.reduce((s,p)=>s+Number(p.amount),0);
  const active=V.filter(x=>x.is_active).length, late=V.filter(x=>x.status==='late').length;
  const name = S.owner.full_name ? ', '+S.owner.full_name.split(' ')[0] : '';
  const week=V.filter(x=>x.dueNow<=0 && x.next && x.next>td && dayDiff(td,x.next)<=7).sort((a,b)=>a.next<b.next?-1:1);
  const ids=new Set(V.map(x=>x.tenant_id));
  const claims=S.claims.filter(c=>ids.has(c.tenant_id));
  return `${phead(t('greeting',{n:name}), esc(P(td).toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'})), addBtn())}
    ${planBanner()}${onlineNudge()}${alertNudge()}
    <div class="kpis">
      <div class="card kpi hero"><div class="lbl">${esc(t('toCollect'))}</div><div class="val num">${money(toCollect)}</div><div class="sm">${hot.length?esc(t('fromN',{n:hot.length})):esc(t('allClear'))}</div></div>
      <div class="card kpi"><div class="lbl">${esc(t('collectedIn',{m:mName(ym)}))}</div><div class="val num">${money(got)}</div><div class="sm">${esc(t('fromPayments',{n:monthPays.length}))}</div></div>
      <div class="card kpi"><div class="lbl">${esc(t('onlinePaid',{m:mName(ym)}))}</div><div class="val num">${money(onlSum)}</div><div class="sm">${esc(t('fromPayments',{n:onl.length}))}</div></div>
      <div class="card kpi"><div class="lbl">${esc(t('activeMembers'))}</div><div class="val num">${active}</div><div class="sm">${late?`<span style="color:var(--bad);font-weight:600">${esc(t('lateN',{n:late}))}</span>`:'&nbsp;'}</div></div>
    </div>
    ${claims.length?`<div class="card" style="margin-top:16px;border-color:var(--info)"><div class="chead"><h3>${esc(t('waitingConfirm'))}</h3><span class="chip info">${claims.length}</span></div>${claims.map(claimRow).join('')}</div>`:''}
    <div class="dgrid">
      <div class="stack" style="gap:16px">
        ${promiseCard(V)}
        ${rentMonthCard(V)}
        <div class="card"><div class="chead"><h3>${esc(t('needsAttention'))}</h3><span class="amt num">${money(toCollect)}</span></div>
          ${hot.length?hot.map(x=>rowT(x,false,true)).join(''):`<div class="empty">${esc(t('allClear'))}</div>`}</div>
        ${week.length?`<div class="card"><div class="chead"><h3>${esc(t('upcomingWeek'))}</h3></div>${week.map(x=>rowT(x,true)).join('')}</div>`:''}
      </div>
      <div class="stack" style="gap:16px">
        <div class="card feed"><div class="chead"><h3>${esc(t('recentPayments'))}</h3><span class="livedot ${S.live?'':'off'}">${esc(t('live'))}</span></div>
          ${pays.length?pays.slice(0,7).map(payRow).join('')+`<button class="linkbtn" data-tab="pay">${esc(t('viewAll'))} →</button>`:`<div class="empty">${esc(t('noRecent'))}</div>`}</div>
        <div class="card"><div class="chead"><div><h3>${esc(t('chartTitle'))}</h3><div class="sub">${esc(t('chartSub',{p:S.pid==='all'?(S.props.length>1?t('allPlaces'):S.props[0].name):propName({prop:S.props.find(p=>p.id===S.pid)})}))}</div></div></div>
          ${chart(pays)}</div>
      </div>
    </div>${fab()}`;
}
function promiseChip(x){
  if(!x.pstate) return '';
  const d=fdate(x.promise.promise_date);
  if(x.pstate==='kept') return `<span class="chip good">✓ ${esc(t('pKept'))}</span>`;
  if(x.pstate==='upcoming') return `<span class="chip info">🗓 ${esc(t('pUpcoming',{d}))}</span>`;
  if(x.pstate==='today') return `<span class="chip warn">${esc(t('pToday'))}</span>`;
  return `<span class="chip bad">${esc(t('pMissed',{d}))}</span>`;
}
function promiseCard(V){
  const td=today(), weekAgo=addDays(td,-7);
  const rows=V.filter(x=>x.promise && (x.pstate!=='kept' || x.promise.promise_date>=weekAgo));
  if(!rows.length) return '';
  const rank={missed:0,today:1,upcoming:2,kept:3};
  rows.sort((a,b)=>rank[a.pstate]-rank[b.pstate] || (a.promise.promise_date<b.promise.promise_date?-1:1));
  const missed=rows.filter(x=>x.pstate==='missed').length;
  return `<div class="card" ${missed?'style="border-color:var(--bad)"':''}><div class="chead"><div><h3>${esc(t('promises'))}</h3><div class="sub">${esc(t('promisesSub'))}</div></div>${missed?`<span class="chip bad">${esc(t('nMissed',{n:missed}))}</span>`:''}</div>
    ${rows.map(x=>`<div class="item" data-open="${x.tenant_id}" role="button" tabindex="0" style="${x.pstate==='missed'?'background:var(--bad-soft);margin:0 -16px;padding:12px 16px':x.pstate==='kept'?'background:var(--good-soft);margin:0 -16px;padding:12px 16px':''}">
      <div class="avatar">${esc(x.name.charAt(0).toUpperCase())}</div>
      <div class="grow"><div class="ell" style="font-weight:600">${esc(x.name)}</div><div class="sub ell">${esc(t(x.promise.created_by==='tenant'?'pByTenant':'pByOwner',{d:fdate(x.promise.promise_date,true)}))}</div></div>
      <div style="text-align:right"><div class="num" style="font-weight:700">${money(x.promise.amount)}</div>${promiseChip(x)}</div></div>`).join('')}</div>`;
}
function rentMonthCard(V){
  const td=today(), rows=V.filter(x=>x.is_active && x.cur);
  if(!rows.length) return '';
  const total=rows.reduce((s,x)=>s+x.cur.amount,0), got=rows.reduce((s,x)=>s+x.cur.paid,0);
  const paidN=rows.filter(x=>x.cur.status==='paid').length, partN=rows.filter(x=>x.cur.status==='part').length;
  const rank={due:0,part:1,upcoming:2,paid:3};
  rows.sort((a,b)=>rank[a.cur.status]-rank[b.cur.status]||a.name.localeCompare(b.name));
  return `<div class="card"><div class="chead"><div><h3>${esc(t('rentOf',{m:P(td).toLocaleDateString(loc(),{month:'long',year:'numeric'})}))}</h3>
      <div class="sub">${esc(t('paidOfN',{a:paidN,b:rows.length}))} · <span class="num">${money(got)}</span> / <span class="num">${money(total)}</span></div></div></div>
    <div class="meter" role="img" aria-label="${esc(t('paidOfN',{a:paidN,b:rows.length}))}"><i style="width:${total?got/total*100:0}%"></i></div>
    <div style="margin-top:6px">${rows.map(x=>`<div class="item" data-open="${x.tenant_id}" role="button" tabindex="0">
      <div class="avatar">${esc(x.name.charAt(0).toUpperCase())}</div>
      <div class="grow"><div class="ell" style="font-weight:600">${esc(x.name)}${S.logins[x.tenant_id]?` <span class="chip info" title="${esc(t('loginOn'))}">${esc(t('appUser'))}</span>`:''}</div><div class="sub ell">${esc([x.room,mRange(x.cur.c)].filter(Boolean).join(' · '))}</div></div>
      <div style="text-align:right"><div class="num" style="font-weight:700">${money(x.cur.amount)}</div>${x.cur.status!=='paid'&&x.pstate&&x.pstate!=='kept'?promiseChip(x):mChip(x.cur)}</div></div>`).join('')}</div></div>`;
}
function claimRow(c){
  const x=byTenant()[c.tenant_id]||{name:'?'};
  return `<div class="claim"><div class="avatar">${esc((x.name||'?').charAt(0).toUpperCase())}</div>
    <div class="grow" style="min-width:160px"><div style="font-weight:600" class="ell">${esc(x.name)}${x.room?` <span class="sub">· ${esc(x.room)}</span>`:''}</div>
    <div class="sub">${esc(t('claimLine',{a:money(c.amount),u:c.utr}))} · ${esc(ago(c.created_at))}</div></div>
    <div class="acts"><button class="btn sm" data-confirm="${c.id}">${esc(t('confirm'))}</button><button class="btn sm danger" data-reject="${c.id}">${esc(t('reject'))}</button></div></div>`;
}
function payRow(p){
  const x=byTenant()[p.tenant_id]||{name:'?'};
  const isNew=S.fresh.has(p.id);

function niceMax(v){ if(v<=0) return 1000; const e=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(m*e>=v) return m*e; return 10*e; }
const short = n => n>=1e7?(n/1e7).toFixed(n%1e7?1:0)+'Cr':n>=1e5?(n/1e5).toFixed(n%1e5?1:0)+'L':n>=1e3?(n/1e3).toFixed(n%1e3?1:0)+'k':String(n);
function chart(pays){
  const d=new Date(), months=[];
  for(let i=5;i>=0;i--) months.push(iso(new Date(d.getFullYear(),d.getMonth()-i,1)).slice(0,7));
  const data=months.map(m=>{ const ps=pays.filter(p=>p.paid_on.slice(0,7)===m && p.mode!=='deposit'); return {m, v:ps.reduce((s,p)=>s+Number(p.amount),0), n:ps.length, o:ps.filter(p=>p.source!=='owner').reduce((s,p)=>s+Number(p.amount),0)}; });
  const max=niceMax(Math.max(...data.map(x=>x.v)));
  const lines=[0,.5,1].map(f=>`<div class="yl ${f===0?'zero':''}" style="bottom:${26+f*(220-8-26)}px"><span class="num">${f?'₹'+short(max*f):'0'}</span></div>`).join('');
  const cur=months[5];
  return `<div class="chart" id="chart" role="img" aria-label="${esc(data.map(x=>mName(x.m,true)+': '+money(x.v)).join('; '))}">${lines}
    <div class="cols">${data.map((x,i)=>`<div class="col ${x.m===cur?'':'past'}" tabindex="0" data-i="${i}" aria-label="${esc(mName(x.m,true)+' '+money(x.v))}">
      ${x.m===cur&&x.v?`<div class="v num">${money(x.v)}</div>`:''}<div class="b" style="height:${x.v?Math.max(2,x.v/max*100):0}%"></div></div>`).join('')}</div>
    <div class="xl">${data.map(x=>`<span>${esc(mName(x.m))}</span>`).join('')}</div></div>
    <script type="application/json" id="chartData">${JSON.stringify(data).replace(/</g,'\\u003c')}<\/script>`;
}
function bindChart(){
  const c=$('#chart'); if(!c) return; const data=JSON.parse($('#chartData').textContent);
  let tip=null;
  const show=col=>{ hide(); const x=data[+col.dataset.i]; tip=document.createElement('div'); tip.className='tip';
    tip.innerHTML=`<b>${esc(mName(x.m,true))}</b> · <span class="num">${money(x.v)}</span><br>${esc(t('fromPayments',{n:x.n}))} · ${esc(t('online2'))} ${money(x.o)}`;
    c.appendChild(tip); const b=col.querySelector('.b'); const cr=c.getBoundingClientRect(), br=b.getBoundingClientRect(), colr=col.getBoundingClientRect();
    let left=colr.left-cr.left+colr.width/2; const w=tip.offsetWidth; left=Math.max(w/2, Math.min(cr.width-w/2, left));
    tip.style.left=left+'px'; tip.style.top=(Math.min(br.top, colr.bottom-4)-cr.top)+'px'; };
  const hide=()=>{ if(tip){ tip.remove(); tip=null; } };
  $$('.col',c).forEach(col=>{ col.onmouseenter=()=>show(col); col.onfocus=()=>show(col); col.onmouseleave=hide; col.onblur=hide; });
}
function statusChip(x){

  if(x.status==='late') return `<span class="chip bad">${esc(x.late===1?t('lateOne'):t('late',{n:x.late}))}</span>`;

function firstChargePreview(rent, join, dd){
  const cs=cycleStart(join,dd), ce=addDays(nextAnchor(cs,dd),-1);
  const cyc=dayDiff(cs,ce)+1, used=dayDiff(join,ce)+1;
  return {days:used, amt:Math.round(rent*used/cyc)};
}

function openAddTenant(){
  if(!access().ok) return openPlans();
  sheet(memberForm(null));
  let depTouched=false;
  const num=id=>Math.max(0,Math.round(Number($('#'+id).value)||0));
  const calc=()=>{ const r=num('tm'), j=$('#tj').value, d=Number($('#tdd').value), dep=num('td');
    if(!(r>0&&j&&d>=1&&d<=31)) return null;
    const f=firstChargePreview(r,j,d), cs=cycleStart(j,d), ce=addDays(nextAnchor(cs,d),-1);
    return {r,j,d,dep,first:f.amt,days:f.days,full:f.days===dayDiff(cs,ce)+1,end:ce}; };
  const upd=()=>{
    if(!depTouched) $('#td').value=$('#tm').value;
    const c=calc(), box=$('#joinBox');
    if(!c){ box.innerHTML=`<div class="sub">${esc(t('joinBoxEmpty'))}</div>`; $('#joinLeft').textContent=''; $('#prev').textContent=''; return; }
    box.innerHTML=`<b>${esc(t('atJoining'))}</b>
      <div class="kv"><span>${esc(c.full?t('firstMonthFull',{a:fdate(c.j),b:fdate(c.end)}):t('firstMonthPart',{a:fdate(c.j),b:fdate(c.end),n:c.days}))}</span><span class="num">${money(c.first)}</span></div>
      <div class="kv"><span>${esc(t('deposit').replace(/\s*\(₹\)/,''))}</span><span class="num">${money(c.dep)}</span></div>
      <div class="kv" style="border-top:1px solid var(--line);padding-top:8px"><span style="color:var(--ink);font-weight:600">${esc(t('totalJoin'))}</span><span class="num" style="font-weight:700;font-size:18px">${money(c.first+c.dep)}</span></div>
      <div class="sub">${esc(t('thenEvery',{r:money(c.r),d:c.d}))}</div>`;
    const paid=num('jrc')+num('jru'), dpaid=num('jdc')+num('jdu'), left=Math.max(0,c.first-paid)+Math.max(0,c.dep-dpaid);
    $('#joinLeft').innerHTML = left>0 ? esc(t('stillToCollect',{a:money(left)})) : `<span style="color:var(--good);font-weight:600">✓ ${esc(t('allCollected'))}</span>`;
    $('#prev').textContent='';
  };
  ['tm','tj','tdd','jrc','jru','jdc','jdu'].forEach(i=>$('#'+i).oninput=upd);
  $('#td').oninput=()=>{ depTouched=true; upd(); };
  $$('[data-fill]').forEach(btn=>btn.onclick=()=>{ const c=calc(); if(!c) return toast(t('joinBoxEmpty')); const m=btn.dataset.fill;
    $('#jrc').value=m==='cash'?c.first:''; $('#jru').value=m==='upi'?c.first:''; $('#jdc').value=m==='cash'&&c.dep?c.dep:''; $('#jdu').value=m==='upi'&&c.dep?c.dep:''; upd(); });
  upd();
  $('#cx').onclick=closeSheet;
  $('#tForm').onsubmit=async e=>{e.preventDefault(); $('#sv').disabled=true;
    const uid=S.session.user.id, j=$('#tj').value;
    const r=await sb.from('tenants').insert({owner_id:uid,property_id:$('#tpp')?$('#tpp').value:S.props[0].id,name:$('#tn').value.trim(),
      phone:$('#tp').value.trim()||null,room:$('#tr').value.trim()||null,rent_amount:num('tm'),security_deposit:num('td'),
      join_date:j,due_day:Number($('#tdd').value),note:$('#tnote').value.trim()||null}).select('id').single();
    if(r.error){ $('#sv').disabled=false; const m=errText(r.error); if(m===t('limitReached')){ closeSheet(); toast(m); return openPlans(); } return toast(m); }
    const tid=r.data.id, on=j<today()?j:today(), note=t('atJoiningNote');
    const pays=[['jrc','cash'],['jru','upi']].filter(([i])=>num(i)>0).map(([i,m])=>({owner_id:uid,tenant_id:tid,amount:num(i),mode:m,paid_on:on,note}));
    const deps=[['jdc','cash'],['jdu','upi']].filter(([i])=>num(i)>0).map(([i,m])=>({owner_id:uid,tenant_id:tid,amount:num(i),mode:m,paid_on:on,note}));
    const errs=[];
    if(pays.length){ const x=await sb.from('payments').insert(pays); if(x.error) errs.push(errText(x.error)); }
    if(deps.length){ const x=await sb.from('deposit_payments').insert(deps); if(x.error) errs.push(errText(x.error)); }
    closeSheet(); await refresh(); toast(errs.length?errs[0]:t('saved')); };
}

// ---------- member detail ----------
function remindText(x){
  const amt=money(x.dueNow>0?x.dueNow:x.bal), prop=propName(x);
  let s = x.pstate==='today' ? t('reminderPromiseToday',{name:x.name,prop,amt}) : x.pstate==='missed' ? t('reminderPromiseMissed',{name:x.name,prop,amt,d:fdate(x.promise.promise_date)})
        : x.status==='late' ? t('reminder',{name:x.name,prop,amt,date:fdate(x.oldest)}) : t('reminderToday',{name:x.name,prop,amt});
  if(x.pay_token && (S.gw.connected || S.owner.upi_id)) s += '\n' + t('payHere',{u:payUrl(x)});
  else if(S.owner.upi_id) s += '\n' + t('upiLine',{u:S.owner.upi_id});
  return s;
}
function linkText(x){ return x.bal>0 ? remindText(x) : t('payHere',{u:payUrl(x)}); }
function waLink(x){ return `https://wa.me/${cleanPhone(x.phone)}?text=${encodeURIComponent(linkText(x))}`; }
async function copyLink(x){ try{ await navigator.clipboard.writeText(payUrl(x)); toast(t('linkCopied')); }catch(e){ prompt(t('copyLink'), payUrl(x)); } }
function ledgerLines(x){
  return [
    ...x.ledger.ch.map(c=>({d:c.due_date,k:c.kind==='waiver'?'w':'c',a:Math.abs(Number(c.amount)),id:c.id,adj:c.kind!=='rent',

    ...x.ledger.pay.map(p=>({d:p.paid_on,k:'p',a:Number(p.amount),l:t('paidVia',{m:modeLabel(p.mode)})+(isTest(p)?' · '+t('testTag'):p.source==='upi'?' · UTR '+(p.ref||''):p.note&&p.source==='owner'?' · '+p.note:''),id:p.id,pay:p.source!=='online'||isTest(p),online:p.source==='online'&&!isTest(p)}))
  ].sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(a.k==='p'?-1:1));

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function pushSupport(){
  if(isIOS && !standalone()) return t('alertsIOS');
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return t('alertsUnsupported');
  if(Notification.permission==='denied') return t('alertsBlocked');
  return '';
}
function keyBytes(b64){ const s=atob(b64.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-b64.length%4)%4)); return Uint8Array.from(s,c=>c.charCodeAt(0)); }
async function enablePush(){
  const why=pushSupport(); if(why) return toast(why);
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ store.set('dd_nudge_off','1'); render(); return toast(t('alertsBlocked')); }
    let key=S.vapid; if(!key){ const r=await sb.rpc('get_vapid_public'); key=r.data; }
    if(!key){ const f=await callFn({action:'vapid'}); key=f.data&&f.data.publicKey; }
    if(!key) return toast(t('alertsNotReady'));
    S.vapid=key;
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(sub){ const cur=sub.options&&sub.options.applicationServerKey; if(cur && btoa(String.fromCharCode(...new Uint8Array(cur))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')!==key){ await sub.unsubscribe(); sub=null; } }
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes(key)});
    const j=sub.toJSON();
    const r=await sb.from('push_subscriptions').upsert({owner_id:S.session.user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,user_agent:navigator.userAgent.slice(0,200)},{onConflict:'endpoint'});
    if(r.error) return toast(r.error.message);
    store.set('dd_push_on','1');
    if(!S.owner.notify_push) await updOwner({notify_push:true});
    render(); testPush();
  }catch(e){ toast(String(e.message||e)); }
}
async function testPush(){
  const r=await callFn({action:'test',lang:lang()});
  if(!r.ok) return toast(t('alertsNotReady'));
  toast(r.data.phones?t('testSent'):t('noPhones'));
}
async function unsubscribePush(){
  try{ if(!('serviceWorker' in navigator)) return; const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){ await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint); await sub.unsubscribe(); } store.set('dd_push_on',''); }catch(e){}
}

    .on('postgres_changes',{event:'INSERT',schema:'public',table:'payments',filter:'owner_id=eq.'+uid}, ev=>onLive('pay',ev.new))
    .on('postgres_changes',{event:'*',schema:'public',table:'payment_claims',filter:'owner_id=eq.'+uid}, ev=>onLive('claim',ev.new))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'payment_promises',filter:'owner_id=eq.'+uid}, ev=>onLive('promise',ev.new))
    .subscribe(st=>{ const on=st==='SUBSCRIBED'; if(on!==S.live){ S.live=on; const d=$('.livedot'); if(d) d.classList.toggle('off',!on); } });
  // fallback if Realtime is off: quietly refresh every 45 s while the page is open
  pollTimer=setInterval(()=>{ if(document.visibilityState==='visible' && !$('#scrim')) refresh(true); }, 45000);
}
function stopLive(){ if(S.rt){ try{ sb.removeChannel(S.rt); }catch(e){} S.rt=null; } clearInterval(pollTimer); S.live=false; }
function onLive(kind, row){
  if(!row) return;
  const x=S.tenants.find(v=>v.tenant_id===row.tenant_id), n=x?x.name:'';
  if(kind==='pay' && row.source==='online'){ S.fresh.add(row.id); toast(t('paidToast',{n,a:money(row.amount)})+(isTest(row)?' ('+t('testTag')+')':'')); }
  if(kind==='promise' && row.created_by==='tenant') toast(t('promiseToast',{n,a:money(row.amount),d:fdate(row.promise_date)}));
  if(kind==='claim' && row.status==='pending' && !S.claims.some(c=>c.id===row.id)) toast(t('claimToast',{n,a:money(row.amount)}));
  clearTimeout(liveTimer); liveTimer=setTimeout(()=>refresh(true), 400);
}

// ---------- boot ----------
async function refresh(quiet){
  const before=new Set(S.payments.map(p=>p.id)), had=S.loaded;
  try{ await loadAll(); S.dbOld=false; }catch(e){
    const m=String((e&&e.message)||e);
    if(/does not exist|Could not find|schema cache|PGRST20[0-9]/i.test(m)){ S.dbOld=m; S.loaded=true; render(); return; }
    if(!S.loaded && !loadCache()) { toast(errText(e)); } else if(!quiet && navigator.onLine!==false) toast(errText(e)); }
  if(had) S.payments.forEach(p=>{ if(!before.has(p.id) && p.source!=='owner') S.fresh.add(p.id); });
  if(S.recovery){ render(); return openRecovery(); }
  if(quiet && $('#scrim')) return; // don't yank an open form
  render();
}
async function syncOnline(){ // catches online payments whose page was closed early
  if(S.synced || !S.gw.connected) return; S.synced=true;
  const r=await callFn({action:'sync'}); if(r.ok && r.data.found) refresh(true);
}
sb.auth.onAuthStateChange((ev,session)=>{
  const was=S.session&&S.session.user.id; S.session=session;
  if(ev==='PASSWORD_RECOVERY') S.recovery=true;
  if(!session){ stopLive(); Object.assign(S,{tenantMode:false,authMode:'login',authMsg:'',owner:null,props:[],tenants:[],charges:[],payments:[],claims:[],loaded:false,tab:'home',pid:'all',synced:false}); render(); return; }
  if(isTenantUser(session.user)){ S.tenantMode=true; store.set('dd_role','tenant'); goTenant(); return; }
  if(was!==session.user.id){ S.loaded=false; loadCache(); render(); setTimeout(async()=>{ await refresh(); startLive(); syncOnline(); },0); }
});
sb.auth.getSession().then(({data})=>{ if(!data.session) render(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.session && S.loaded) refresh(true); });
window.addEventListener('online',()=>{ if(S.session) refresh(true); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
